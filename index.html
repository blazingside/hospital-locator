<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ค้นหาเวชภัณฑ์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --white: #ffffff;
    --blue: #1d5fa8;
    --blue-dark: #154a87;
    --blue-light: #e8f0fb;
    --blue-mid: #4a8fd4;
    --border: #dde3ed;
    --text: #1a2235;
    --text-dim: #5a6a85;
    --text-muted: #96a3b8;
    --shadow: 0 2px 8px rgba(0,0,0,0.07);
    --shadow-lg: 0 6px 24px rgba(0,0,0,0.11);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Noto Sans Thai', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ───── Header ───── */
  .header {
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, var(--blue-mid) 100%);
    padding: 20px 20px 28px;
  }
  .hosp-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px;
  }
  .hosp-logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .hosp-text {}
  .hosp-name { font-size: 11px; color: rgba(255,255,255,0.7); }
  .hosp-system { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .room-pill {
    margin-left: auto; flex-shrink: 0;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 12px; font-weight: 500;
    padding: 5px 12px; border-radius: 20px;
  }

  /* Search */
  .search-wrap { position: relative; }
  .s-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:17px; pointer-events:none; }
  #searchInput {
    width: 100%; border: none; outline: none;
    font-family: 'Noto Sans Thai', sans-serif; font-size: 15px;
    color: var(--text); background: #fff;
    padding: 14px 44px 14px 44px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  #searchInput::placeholder { color: var(--text-muted); }
  .s-clear {
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background: var(--border); border:none; color:var(--text-dim);
    width:24px; height:24px; border-radius:50%; font-size:11px;
    cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .s-clear.show { display:flex; }

  /* ───── Body ───── */
  .body { padding: 16px; }

  /* Category */
  .cat-scroll {
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px; margin-bottom:16px;
    scrollbar-width:none;
  }
  .cat-scroll::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0; padding:7px 15px; border-radius:20px;
    border: 1.5px solid var(--border);
    background: var(--white); color: var(--text-dim);
    font-size: 13px; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
    font-weight: 500;
  }
  .chip.active {
    background: var(--blue); border-color: var(--blue);
    color: #fff;
  }

  /* Result line */
  .res-line {
    font-size: 13px; color: var(--text-muted);
    margin-bottom: 12px;
  }
  .res-line strong { color: var(--text-dim); }

  /* ───── Card ───── */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    overflow: hidden;
    animation: up 0.22s ease both;
  }
  @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .card-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; cursor: pointer;
  }
  .card-row:active { background: var(--bg); }

  /* Photo */
  .item-photo {
    width: 60px; height: 60px; border-radius: 10px;
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0; overflow: hidden;
    border: 1px solid var(--border);
  }
  .item-photo img { width:100%; height:100%; object-fit:cover; }

  .item-mid { flex:1; min-width:0; }
  .item-name {
    font-size: 15px; font-weight: 700; margin-bottom: 3px;
    line-height: 1.3;
  }
  .item-cat { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .highlight { color: var(--blue); }

  /* Location preview badge */
  .loc-preview {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--blue-light); color: var(--blue);
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 8px;
  }

  .chevron {
    color: var(--text-muted); font-size: 13px;
    transition: transform 0.2s; flex-shrink:0;
  }
  .chevron.open { transform: rotate(180deg); }

  /* ───── Detail ───── */
  .detail {
    display: none; border-top: 1px solid var(--border);
    padding: 16px;
  }
  .detail.show { display: block; }

  /* Big photo */
  .big-photo {
    width: 100%; height: 180px; border-radius: var(--radius-sm);
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; overflow: hidden;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .big-photo img { width:100%; height:100%; object-fit:cover; }

  /* Cabinet map */
  .section-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .cabinet-wrap {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 14px; margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .cabinet-title {
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }

  .shelf-list { display: flex; flex-direction: column; gap: 6px; }
  .shelf-row { display: flex; align-items: center; gap: 8px; }
  .shelf-tag {
    font-size: 11px; color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    width: 44px; text-align: right; flex-shrink: 0;
  }
  .shelf-slot {
    flex: 1; height: 32px; border-radius: 7px;
    background: var(--border);
    display: flex; align-items: center; padding: 0 10px;
    font-size: 12px; color: var(--text-muted);
  }
  .shelf-slot.here {
    background: var(--blue); color: #fff; font-weight: 600;
  }
  .shelf-slot.here .here-arrow { margin-left: auto; font-size: 13px; }

  /* Location cards */
  .loc-cards { display: flex; flex-direction: column; gap: 8px; }
  .loc-card {
    background: var(--blue-light);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .loc-num {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: 'DM Mono', monospace;
  }
  .loc-body { flex: 1; }
  .loc-main { font-size: 14px; font-weight: 700; color: var(--blue); }
  .loc-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-family: 'DM Mono', monospace; }

  /* Empty */
  .empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-icon { font-size:44px; margin-bottom:12px; }

  .footer {
    text-align:center; padding:20px 16px;
    font-size:12px; color:var(--text-muted);
    border-top: 1px solid var(--border); margin-top:8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="hosp-row">
    <div class="hosp-logo">🏥</div>
    <div class="hosp-text">
      <div class="hosp-name">โรงพยาบาลตัวอย่าง</div>
      <div class="hosp-system">ค้นหาเวชภัณฑ์</div>
    </div>
    <div class="room-pill">📍 ห้องเก็บยา 1</div>
  </div>
  <div class="search-wrap">
    <div class="s-icon">🔍</div>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อเวชภัณฑ์..." autocomplete="off">
    <button class="s-clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>

<div class="body">
  <div class="cat-scroll">
    <button class="chip active" onclick="setFilter('all',this)">ทั้งหมด</button>
    <button class="chip" onclick="setFilter('เข็มและไซริงค์',this)">💉 เข็ม/ไซริงค์</button>
    <button class="chip" onclick="setFilter('สายและข้อต่อ',this)">🔗 สายและข้อต่อ</button>
    <button class="chip" onclick="setFilter('ผ้าและสำลี',this)">🩹 ผ้าและสำลี</button>
    <button class="chip" onclick="setFilter('ถุงมือ',this)">🧤 ถุงมือ</button>
  </div>

  <div class="res-line">พบ <strong id="resCount">0</strong> รายการ</div>

  <div id="results"></div>

  <div class="footer">ห้องเก็บยา 1 · ตู้ A–E · อัปเดต 13/05/2569</div>
</div>

<script>
const items = [
  {
    id:"M001", name:"เข็มฉีดยา 23G", category:"เข็มและไซริงค์", icon:"💉",
    locations:[
      { cabinet:"ตู้ A", shelf:"ชั้น 2", zone:"ช่อง 003" },
    ]
  },
  {
    id:"M002", name:"ไซริงค์ 5 ml", category:"เข็มและไซริงค์", icon:"💉",
    locations:[
      { cabinet:"ตู้ A", shelf:"ชั้น 2", zone:"ช่อง 004" },
      { cabinet:"ตู้ B", shelf:"ชั้น 1", zone:"ช่อง 001" },
    ]
  },
  {
    id:"M003", name:"ไซริงค์ 10 ml", category:"เข็มและไซริงค์", icon:"💉",
    locations:[
      { cabinet:"ตู้ A", shelf:"ชั้น 3", zone:"ช่อง 001" },
    ]
  },
  {
    id:"M004", name:"สายน้ำเกลือ IV Set", category:"สายและข้อต่อ", icon:"🔗",
    locations:[
      { cabinet:"ตู้ C", shelf:"ชั้น 1", zone:"ช่อง 001" },
    ]
  },
  {
    id:"M005", name:"ข้อต่อ 3 ทาง Stopcock", category:"สายและข้อต่อ", icon:"🔗",
    locations:[
      { cabinet:"ตู้ C", shelf:"ชั้น 1", zone:"ช่อง 003" },
    ]
  },
  {
    id:"M006", name:"สำลีก้อน", category:"ผ้าและสำลี", icon:"🩹",
    locations:[
      { cabinet:"ตู้ D", shelf:"ชั้น 1", zone:"ช่อง 001" },
    ]
  },
  {
    id:"M007", name:"ก๊อซ 4x4 นิ้ว", category:"ผ้าและสำลี", icon:"🩹",
    locations:[
      { cabinet:"ตู้ D", shelf:"ชั้น 2", zone:"ช่อง 002" },
    ]
  },
  {
    id:"M008", name:"ถุงมือ Latex ไม่มีแป้ง (S)", category:"ถุงมือ", icon:"🧤",
    locations:[
      { cabinet:"ตู้ E", shelf:"ชั้น 1", zone:"ช่อง 001" },
    ]
  },
  {
    id:"M009", name:"ถุงมือ Latex ไม่มีแป้ง (M)", category:"ถุงมือ", icon:"🧤",
    locations:[
      { cabinet:"ตู้ E", shelf:"ชั้น 1", zone:"ช่อง 002" },
    ]
  },
  {
    id:"M010", name:"ถุงมือ Nitrile (M)", category:"ถุงมือ", icon:"🧤",
    locations:[
      { cabinet:"ตู้ E", shelf:"ชั้น 2", zone:"ช่อง 001" },
    ]
  },
];

const allShelves = ['ชั้น 1','ชั้น 2','ชั้น 3'];
let currentFilter = 'all';

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return items.filter(item => {
    const matchCat = currentFilter === 'all' ? true : item.category === currentFilter;
    if (!q) return matchCat;
    return matchCat && `${item.name} ${item.category} ${item.id}`.toLowerCase().includes(q);
  });
}

function render() {
  const q = document.getElementById('searchInput').value.trim();
  const filtered = getFiltered();
  document.getElementById('resCount').textContent = filtered.length;

  const el = document.getElementById('results');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>ไม่พบเวชภัณฑ์ที่ค้นหา</p></div>`;
    return;
  }

  el.innerHTML = filtered.map((item, i) => {
    const firstLoc = item.locations[0];

    // shelf visual for first cabinet
    const shelfRows = allShelves.map(s => {
      const match = item.locations.find(l => l.shelf === s && l.cabinet === firstLoc.cabinet);
      if (match) {
        return `<div class="shelf-row">
          <div class="shelf-tag">${s}</div>
          <div class="shelf-slot here">${match.zone} <span class="here-arrow">◀ ที่นี่</span></div>
        </div>`;
      }
      return `<div class="shelf-row">
        <div class="shelf-tag">${s}</div>
        <div class="shelf-slot">—</div>
      </div>`;
    }).join('');

    const locCards = item.locations.map((l, idx) => `
      <div class="loc-card">
        <div class="loc-num">${idx+1}</div>
        <div class="loc-body">
          <div class="loc-main">${l.cabinet} · ${l.shelf}</div>
          <div class="loc-sub">${l.zone}</div>
        </div>
      </div>
    `).join('');

    return `<div class="card" style="animation-delay:${i*0.04}s">
      <div class="card-row" onclick="toggleCard(this)">
        <div class="item-photo">${item.icon}</div>
        <div class="item-mid">
          <div class="item-name">${highlight(item.name, q)}</div>
          <div class="item-cat">${item.category}</div>
          <div class="loc-preview">📍 ${firstLoc.cabinet} · ${firstLoc.shelf} · ${firstLoc.zone}</div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="detail">
        <div class="big-photo">${item.icon}</div>

        <div class="section-label">📍 ตำแหน่งที่เก็บ</div>
        <div class="cabinet-wrap">
          <div class="cabinet-title">🗄️ ${firstLoc.cabinet} — ผังชั้นวาง</div>
          <div class="shelf-list">${shelfRows}</div>
        </div>
        <div class="loc-cards">${locCards}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(row) {
  const det = row.nextElementSibling;
  const chev = row.querySelector('.chevron');
  const isOpen = det.classList.contains('show');
  document.querySelectorAll('.detail.show').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.chevron.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) { det.classList.add('show'); chev.classList.add('open'); }
}

function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  render();
}

let t;
document.getElementById('searchInput').addEventListener('input', function() {
  document.getElementById('clearBtn').classList.toggle('show', this.value.length > 0);
  clearTimeout(t); t = setTimeout(render, 180);
});

render();
</script>
</body>
</html>
