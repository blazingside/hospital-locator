<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Alignment Test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a6230;
    --parchment: #f4e8c1;
    --parchment-dark: #e0ccA0;
    --ink: #1a1208;
    --blood: #8b1a1a;
    --shadow: #0a0806;
    --stone: #2a2318;
    --stone-light: #3d3525;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--shadow);
    color: var(--parchment);
    font-family: 'IM Fell English', serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(139,26,26,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.06) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ===== PARTICLES ===== */
  .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .particle {
    position:absolute; width:2px; height:2px; background:var(--gold);
    border-radius:50%; opacity:0;
    animation: floatUp var(--dur, 8s) var(--delay, 0s) infinite ease-in-out;
  }
  @keyframes floatUp {
    0%   { opacity:0; transform: translateY(100vh) scale(0); }
    10%  { opacity:0.6; }
    90%  { opacity:0.3; }
    100% { opacity:0; transform: translateY(-10vh) scale(1.5); }
  }

  /* ===== WRAPPER ===== */
  #app {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeIn 1.2s ease both;
  }
  .header-sigil {
    font-size: 3rem;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.5));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 20px rgba(201,168,76,0.4))} 50%{filter:drop-shadow(0 0 40px rgba(201,168,76,0.8))} }
  .header h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 900;
    color: var(--gold-light);
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(201,168,76,0.4), 2px 2px 0 var(--shadow);
    line-height: 1.2;
  }
  .header p {
    margin-top: 10px;
    color: var(--parchment-dark);
    font-style: italic;
    font-size: 1.05rem;
    opacity: 0.85;
  }
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 0;
    color: var(--gold-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 4px;
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
  }

  /* ===== PROGRESS ===== */
  .progress-wrap {
    margin-bottom: 30px;
    animation: fadeIn 0.6s ease both;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: var(--stone);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--stone-light);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blood), var(--gold), var(--gold-light));
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 10px rgba(201,168,76,0.4);
  }

  /* ===== CARD ===== */
  .card {
    background: linear-gradient(135deg, var(--stone) 0%, var(--stone-light) 50%, var(--stone) 100%);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 36px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.1),
      0 20px 60px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(201,168,76,0.1);
    animation: slideUp 0.5s ease both;
  }
  .card::before {
    content:''; position:absolute; inset:6px;
    border:1px solid rgba(201,168,76,0.08);
    border-radius:2px; pointer-events:none;
  }
  /* Corner ornaments */
  .card::after {
    content:'✦';
    position: absolute; top: 10px; right: 14px;
    color: var(--gold-dim); font-size: 0.7rem; opacity: 0.5;
  }
  @keyframes slideUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity:0; } to { opacity:1; }
  }

  .q-number {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    color: var(--gold-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .q-category {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--blood);
    border: 1px solid var(--blood);
    padding: 2px 8px;
    border-radius: 2px;
    margin-bottom: 16px;
    opacity: 0.8;
  }
  .q-text {
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--parchment);
    margin-bottom: 28px;
  }
  .q-context {
    font-style: italic;
    font-size: 0.9rem;
    color: var(--parchment-dark);
    opacity: 0.7;
    margin-bottom: 24px;
    padding-left: 14px;
    border-left: 2px solid var(--gold-dim);
    line-height: 1.6;
  }

  /* ===== OPTIONS ===== */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 3px;
    color: var(--parchment-dark);
    cursor: pointer;
    font-family: 'IM Fell English', serif;
    font-size: 0.98rem;
    line-height: 1.55;
    padding: 14px 18px;
    text-align: left;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content:'';
    position: absolute; top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.05), transparent);
    transition: left 0.4s ease;
  }
  .option-btn:hover { border-color: var(--gold); color: var(--parchment); background: rgba(201,168,76,0.06); }
  .option-btn:hover::before { left:100%; }
  .option-btn.selected {
    border-color: var(--gold-light);
    background: rgba(201,168,76,0.12);
    color: var(--gold-light);
    box-shadow: 0 0 15px rgba(201,168,76,0.15), inset 0 0 15px rgba(201,168,76,0.05);
  }
  .option-letter {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    color: var(--gold-dim);
    margin-right: 10px;
    letter-spacing: 1px;
  }

  /* ===== NAV ===== */
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:28px; gap:12px; }
  .btn {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 24px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid;
  }
  .btn-prev {
    background: transparent;
    border-color: var(--stone-light);
    color: var(--gold-dim);
  }
  .btn-prev:hover { border-color: var(--gold-dim); color: var(--gold); }
  .btn-next {
    background: linear-gradient(135deg, var(--blood), #6b1414);
    border-color: var(--blood);
    color: var(--parchment);
    box-shadow: 0 4px 20px rgba(139,26,26,0.4);
  }
  .btn-next:hover { background: linear-gradient(135deg, #a02020, var(--blood)); box-shadow: 0 4px 30px rgba(139,26,26,0.6); }
  .btn-next:disabled { opacity:0.3; cursor:not-allowed; box-shadow:none; }
  .btn-result {
    background: linear-gradient(135deg, var(--gold-dim), #5a4820);
    border-color: var(--gold);
    color: var(--gold-light);
    box-shadow: 0 4px 20px rgba(201,168,76,0.25);
  }
  .btn-result:hover { background: linear-gradient(135deg, var(--gold), var(--gold-dim)); box-shadow: 0 4px 30px rgba(201,168,76,0.4); }
  .btn-result:disabled { opacity:0.3; cursor:not-allowed; }

  /* ===== RESULT ===== */
  .result-wrap { animation: fadeIn 0.8s ease both; }
  .result-header { text-align:center; margin-bottom: 40px; }
  .alignment-badge {
    display: inline-block;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    color: var(--gold-light);
    padding: 16px 32px;
    border: 2px solid var(--gold);
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(201,168,76,0.05));
    box-shadow: 0 0 40px rgba(201,168,76,0.2), inset 0 0 20px rgba(201,168,76,0.05);
    letter-spacing: 3px;
    margin: 16px 0;
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100%{box-shadow:0 0 40px rgba(201,168,76,0.2),inset 0 0 20px rgba(201,168,76,0.05)}
    50%{box-shadow:0 0 60px rgba(201,168,76,0.4),inset 0 0 30px rgba(201,168,76,0.1)}
  }
  .result-subtitle { font-style:italic; color:var(--parchment-dark); opacity:0.8; }
  .result-icon { font-size: 4rem; margin: 16px 0; filter: drop-shadow(0 0 20px rgba(201,168,76,0.5)); }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
  @media(max-width:560px){ .result-grid{grid-template-columns:1fr;} }

  .result-section {
    background: linear-gradient(135deg, var(--stone), var(--stone-light));
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 22px;
    position: relative;
  }
  .result-section.full { grid-column: 1 / -1; }
  .result-section h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }
  .result-section p, .result-section li {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--parchment-dark);
  }
  .result-section ul { padding-left: 18px; }
  .result-section li { margin-bottom: 6px; }
  .result-section strong { color: var(--parchment); }

  /* Axes bars */
  .axis-wrap { margin: 8px 0 12px; }
  .axis-label { display:flex; justify-content:space-between; font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:2px; color:var(--gold-dim); margin-bottom:6px; }
  .axis-bar { height:8px; background:var(--shadow); border-radius:4px; overflow:hidden; border:1px solid var(--stone-light); }
  .axis-fill { height:100%; border-radius:4px; transition: width 1.5s cubic-bezier(0.4,0,0.2,1); }
  .axis-fill.law  { background: linear-gradient(90deg, #4a90d9, #7ab3f0); box-shadow:0 0 8px rgba(74,144,217,0.4); }
  .axis-fill.good { background: linear-gradient(90deg, #5a9e5a, #7dc47d); box-shadow:0 0 8px rgba(90,158,90,0.4); }

  /* Famous chars */
  .char-list { display:flex; flex-wrap:wrap; gap:8px; }
  .char-tag {
    background: rgba(201,168,76,0.08);
    border: 1px solid var(--gold-dim);
    border-radius: 2px;
    padding: 4px 10px;
    font-family:'Cinzel',serif;
    font-size:0.65rem;
    letter-spacing:2px;
    color: var(--gold);
  }

  .alignment-grid-display {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 10px 0;
  }
  .ag-cell {
    background: var(--shadow);
    border: 1px solid var(--stone-light);
    border-radius: 3px;
    padding: 8px 6px;
    text-align:center;
    font-family:'Cinzel',serif;
    font-size:0.6rem;
    letter-spacing:1px;
    color:var(--gold-dim);
    transition: all 0.3s;
  }
  .ag-cell.active {
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border-color: var(--gold);
    color: var(--gold-light);
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
  }

  .btn-restart {
    display: block;
    width: 100%;
    margin-top: 30px;
    background: linear-gradient(135deg, var(--stone), var(--stone-light));
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family:'Cinzel',serif;
    font-size:0.75rem;
    letter-spacing:4px;
    text-transform:uppercase;
    padding:14px;
    border-radius:3px;
    cursor:pointer;
    transition:all 0.25s;
    text-align:center;
  }
  .btn-restart:hover { border-color:var(--gold-light); color:var(--gold-light); background:rgba(201,168,76,0.08); }

  .scroll-ornament { text-align:center; color:var(--gold-dim); font-size:1.2rem; margin: 20px 0; opacity:0.5; }

  /* Intro screen */
  .intro-wrap { text-align:center; animation: fadeIn 1s ease both; }
  .intro-scroll {
    background: linear-gradient(135deg, var(--stone), var(--stone-light));
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 40px 36px;
    margin: 30px 0;
    text-align:left;
    position:relative;
  }
  .intro-scroll p { line-height:1.8; color:var(--parchment-dark); margin-bottom:14px; font-size:0.98rem; }
  .intro-scroll p:last-child { margin-bottom:0; }
  .intro-scroll strong { color:var(--parchment); }
  .alignment-legend {
    display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin:20px 0;
  }
  .legend-cell {
    background: var(--shadow);
    border: 1px solid var(--stone-light);
    border-radius:3px;
    padding:10px 8px;
    text-align:center;
  }
  .legend-cell .lc-name { font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:2px; color:var(--gold); display:block; margin-bottom:4px; }
  .legend-cell .lc-th  { font-size:0.78rem; color:var(--parchment-dark); }

  .btn-start {
    background: linear-gradient(135deg, var(--gold-dim), #4a3510);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family:'Cinzel Decorative',serif;
    font-size:0.9rem;
    letter-spacing:3px;
    padding:16px 48px;
    border-radius:3px;
    cursor:pointer;
    box-shadow: 0 4px 30px rgba(201,168,76,0.2);
    transition:all 0.3s;
    margin-top:10px;
  }
  .btn-start:hover { background:linear-gradient(135deg,var(--gold),var(--gold-dim)); box-shadow:0 4px 40px rgba(201,168,76,0.4); transform:translateY(-2px); }

  /* Score visual */
  .score-visual { display:flex; gap:16px; align-items:flex-start; }
  .score-bar-wrap { flex:1; }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div id="app">
  <div class="header">
    <div class="header-sigil">⚔️</div>
    <h1>THE ALIGNMENT<br>ORACLE</h1>
    <div class="divider">✦ D&D Alignment Test ✦</div>
    <p>เปิดเผยจิตวิญญาณแท้จริงของเจ้าผ่านมิติแห่งกฎและศีลธรรม</p>
  </div>
  <div id="screen"></div>
</div>

<script>
// ===== PARTICLES =====
(function(){
  const c = document.getElementById('particles');
  for(let i=0;i<25;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = Math.random()*100+'%';
    p.style.setProperty('--dur', (6+Math.random()*10)+'s');
    p.style.setProperty('--delay', (Math.random()*10)+'s');
    p.style.width = (1+Math.random()*2)+'px';
    p.style.height = p.style.width;
    c.appendChild(p);
  }
})();

// ===== QUESTIONS =====
// Each answer: [lawfulness_delta, goodness_delta]
// lawfulness: positive = Lawful, negative = Chaotic
// goodness:   positive = Good,   negative = Evil
const questions = [
  {
    category: "กฎและระเบียบ",
    text: "ท่านเดินทางผ่านเมืองที่มีกฎห้ามพกอาวุธในที่สาธารณะ แต่ท่านรู้ว่าพื้นที่นี้อันตราย",
    context: "เจ้าหน้าที่ยืนอยู่ที่ประตูเมือง คอยตรวจค้นผู้เดินทางทุกคน",
    options: [
      { text: "ปลดอาวุธและฝากไว้กับเจ้าหน้าที่ตามกฎอย่างเคร่งครัด ความปลอดภัยต้องอยู่ใต้กฎหมาย", val:[2,1] },
      { text: "ประกาศอาวุธอย่างตรงไปตรงมา แล้วขอการยกเว้นจากเจ้าหน้าที่ด้วยเหตุผล", val:[1,0] },
      { text: "ซ่อนอาวุธบางส่วนไว้เพื่อความปลอดภัย ส่วนที่เหลือปลดให้เจ้าหน้าที่", val:[-1,0] },
      { text: "เดินผ่านโดยซ่อนอาวุธทั้งหมด — กฎที่โง่เขลาไม่ควรบังคับใช้กับคนฉลาด", val:[-2,0] },
    ]
  },
  {
    category: "ศีลธรรม",
    text: "ท่านพบขอทานแก่ชราที่ดูหิวโหยมาก แต่เงินในกระเป๋าท่านเหลือน้อยมาก",
    context: "การเดินทางของท่านยังต้องใช้เงินอีกมาก และไม่รู้ว่าจะหาเพิ่มได้เมื่อไร",
    options: [
      { text: "ให้เงินทั้งหมดที่มีโดยไม่ลังเล ชีวิตคนสำคัญกว่าความสะดวกของเรา", val:[0,3] },
      { text: "ให้เงินครึ่งหนึ่ง พร้อมบอกทางไปยังวัดหรือสถานสงเคราะห์ที่ใกล้ที่สุด", val:[1,2] },
      { text: "ให้เหรียญเล็กน้อยแล้วก็จากไป — ฉันก็มีหน้าที่ต้องดูแลตัวเอง", val:[0,-1] },
      { text: "เดินผ่านไป ในโลกนี้ทุกคนต้องดิ้นรนเอง", val:[0,-2] },
    ]
  },
  {
    category: "ความยุติธรรม",
    text: "ท่านจับตัวนักฆ่าโหดเหี้ยมที่สังหารผู้คนมาแล้วหลายราย แต่ศาลท้องถิ่นฉ้อฉลอาจปล่อยเขาฟรี",
    context: "ครอบครัวของเหยื่อยืนอยู่ต่อหน้าท่าน เรียกร้องให้ลงโทษเดี๋ยวนี้",
    options: [
      { text: "ส่งตัวให้ศาลโดยไม่มีเงื่อนไข แม้ผลจะไม่ยุติธรรม กระบวนการกฎหมายต้องได้รับการเคารพ", val:[3,-1] },

  "Chaotic Evil":    { th:"วุ่นวาย-ชั่ว", icon:"💀", desc:"ความวุ่นวายและการทำลายล้างคือธรรมชาติที่แท้จริง", chars:["The Joker","Sauron","Doomsday","Carnage"], color:"#cc2200", playstyle:"คุณทำตามแรงกระตุ้นและความปรารถนาโดยไม่มีข้อจำกัด ความวุ่นวายและอิสระจากทุกโซ่ตรวนคือสิ่งที่คุณแสวงหา" },
};

// ===== STATE =====
let state = {
  phase: 'intro', // intro | quiz | result
  current: 0,
  answers: new Array(questions.length).fill(null),
  lawScore: 0,
  goodScore: 0,
};

// ===== RENDER =====
const screen = document.getElementById('screen');

function render() {
  if(state.phase === 'intro') renderIntro();
  else if(state.phase === 'quiz') renderQuestion();
  else renderResult();
}

function renderIntro() {
  screen.innerHTML = `
  <div class="intro-wrap">
    <div class="intro-scroll">
      <p>แบบทดสอบนี้จะช่วยเปิดเผย <strong>จิตวิญญาณที่แท้จริง</strong> ของท่านตามระบบ Alignment อันโบราณของ Dungeons & Dragons</p>
      <p>ระบบ Alignment แบ่งออกเป็น <strong>2 มิติ</strong>:</p>
      <ul style="padding-left:20px;color:var(--parchment-dark);font-size:0.95rem;line-height:2;margin-bottom:14px;">
        <li><strong style="color:var(--parchment)">แกนแรก: กฎ ↔ วุ่นวาย</strong> — ท่านปฏิบัติตามกฎและระบบมากแค่ไหน?</li>
        <li><strong style="color:var(--parchment)">แกนที่สอง: ดี ↔ ชั่ว</strong> — ท่านให้ความสำคัญกับสวัสดิภาพของผู้อื่นมากแค่ไหน?</li>
      </ul>
      <div class="alignment-legend">
        <div class="legend-cell"><span class="lc-name">LAWFUL GOOD</span><span class="lc-th">กฎหมาย-ดี</span></div>
        <div class="legend-cell"><span class="lc-name">NEUTRAL GOOD</span><span class="lc-th">กลาง-ดี</span></div>
        <div class="legend-cell"><span class="lc-name">CHAOTIC GOOD</span><span class="lc-th">วุ่นวาย-ดี</span></div>
        <div class="legend-cell"><span class="lc-name">LAWFUL NEUTRAL</span><span class="lc-th">กฎหมาย-กลาง</span></div>
        <div class="legend-cell"><span class="lc-name">TRUE NEUTRAL</span><span class="lc-th">กลาง-กลาง</span></div>
        <div class="legend-cell"><span class="lc-name">CHAOTIC NEUTRAL</span><span class="lc-th">วุ่นวาย-กลาง</span></div>
        <div class="legend-cell"><span class="lc-name">LAWFUL EVIL</span><span class="lc-th">กฎหมาย-ชั่ว</span></div>
        <div class="legend-cell"><span class="lc-name">NEUTRAL EVIL</span><span class="lc-th">กลาง-ชั่ว</span></div>
        <div class="legend-cell"><span class="lc-name">CHAOTIC EVIL</span><span class="lc-th">วุ่นวาย-ชั่ว</span></div>
      </div>
      <p>แบบทดสอบมี <strong>${questions.length} คำถาม</strong> แต่ละคำถามมีสถานการณ์จำลองที่ท่านต้องเลือกแนวทางที่ตรงกับตัวตนจริงของท่านมากที่สุด</p>
      <p style="font-style:italic;opacity:0.7">ไม่มีคำตอบถูกหรือผิด — จงตอบตามสัญชาตญาณที่แท้จริงของท่าน</p>
    </div>
    <button class="btn-start" onclick="startQuiz()">✦ เริ่มการทดสอบ ✦</button>
  </div>`;
}

function renderQuestion() {
  const q = questions[state.current];
  const pct = Math.round((state.current / questions.length) * 100);
  const letters = ['A','B','C','D'];
  screen.innerHTML = `
  <div class="progress-wrap">
    <div class="progress-info">
      <span>✦ คำถามที่ ${state.current+1} จาก ${questions.length}</span>
      <span>${pct}% สำเร็จแล้ว</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="card">
    <div class="q-number">QUESTION ${String(state.current+1).padStart(2,'0')}</div>
    <div class="q-category">${q.category}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-context">${q.context}</div>
    <div class="options">
      ${q.options.map((o,i)=>`
        <button class="option-btn ${state.answers[state.current]===i?'selected':''}" onclick="selectAnswer(${i})">
          <span class="option-letter">${letters[i]}.</span>${o.text}
        </button>
      `).join('')}
    </div>
    <div class="nav">
      <button class="btn btn-prev" onclick="prevQ()" ${state.current===0?'style="visibility:hidden"':''}>← ย้อนกลับ</button>
      ${state.current < questions.length-1
        ? `<button class="btn btn-next" onclick="nextQ()" ${state.answers[state.current]===null?'disabled':''}>ถัดไป →</button>`
        : `<button class="btn btn-result" onclick="showResult()" ${state.answers[state.current]===null?'disabled':''}>✦ เปิดเผยผลลัพธ์ ✦</button>`
      }
    </div>
  </div>`;
}

function renderResult() {
  const alignment = calcAlignment();
  const data = alignments[alignment];
  const lawPct = Math.round(((state.lawScore + 30) / 60) * 100);
  const goodPct = Math.round(((state.goodScore + 30) / 60) * 100);
  const allNames = Object.keys(alignments);

  screen.innerHTML = `
  <div class="result-wrap">
    <div class="result-header card">
      <div style="text-align:center">
        <div class="q-number" style="text-align:center;margin-bottom:4px">✦ ALIGNMENT REVEALED ✦</div>
        <div class="result-icon">${data.icon}</div>
        <div class="alignment-badge">${alignment.toUpperCase()}</div>
        <div style="font-family:'Cinzel',serif;font-size:0.9rem;color:var(--gold);letter-spacing:3px;margin:6px 0">${data.th}</div>
        <div class="result-subtitle">${data.desc}</div>
      </div>
    </div>

    <div class="scroll-ornament">⚜ ⚜ ⚜</div>

    <div class="result-grid">
      <div class="result-section">
        <h3>⚡ สไตล์การเล่น</h3>
        <p>${data.playstyle}</p>
      </div>
      <div class="result-section">
        <h3>🎭 ตัวละครที่มีแนวโน้มเดียวกัน</h3>
        <div class="char-list">
          ${data.chars.map(c=>`<span class="char-tag">${c}</span>`).join('')}
        </div>
      </div>

      <div class="result-section full">
        <h3>📊 คะแนน 2 มิติ</h3>
        <div class="score-visual">
          <div class="score-bar-wrap">
            <div class="axis-wrap">
              <div class="axis-label"><span>⚖️ LAWFUL (กฎหมาย)</span><span>🌀 CHAOTIC (วุ่นวาย)</span></div>
              <div class="axis-bar"><div class="axis-fill law" id="law-fill" style="width:0%"></div></div>
            </div>
            <div class="axis-wrap" style="margin-top:16px">
              <div class="axis-label"><span>✨ GOOD (ดี)</span><span>💀 EVIL (ชั่ว)</span></div>
              <div class="axis-bar"><div class="axis-fill good" id="good-fill" style="width:0%"></div></div>
            </div>
            <p style="margin-top:14px;font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:2px;color:var(--gold-dim)">
              LAWFUL-CHAOTIC: ${state.lawScore > 5 ? '⚖️ LAWFUL +'+state.lawScore : state.lawScore < -5 ? '🌀 CHAOTIC '+state.lawScore : '☯️ NEUTRAL ('+state.lawScore+')'}
              &nbsp;&nbsp;|&nbsp;&nbsp;
              GOOD-EVIL: ${state.goodScore > 5 ? '✨ GOOD +'+state.goodScore : state.goodScore < -5 ? '💀 EVIL '+state.goodScore : '☯️ NEUTRAL ('+state.goodScore+')'}
            </p>
          </div>
        </div>
      </div>

      <div class="result-section full">
        <h3>🗺️ ตำแหน่งใน Alignment Grid</h3>
        <div class="alignment-grid-display">
          ${allNames.map(name=>`
            <div class="ag-cell ${name===alignment?'active':''}">
              ${alignments[name].icon} ${name}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-section full">
        <h3>⚔️ คำแนะนำสำหรับ Dungeon Master</h3>
        <p>หากท่านกำลังสร้างตัวละคร <strong>${alignment}</strong> ควรพิจารณา:</p>
        <ul style="margin-top:10px">
          ${getAdvice(alignment).map(a=>`<li>${a}</li>`).join('')}
        </ul>
      </div>
    </div>

    <button class="btn-restart" onclick="restart()">↺ ทดสอบอีกครั้ง</button>
  </div>`;

  setTimeout(()=>{
    document.getElementById('law-fill').style.width = lawPct+'%';
    document.getElementById('good-fill').style.width = goodPct+'%';
  },400);
}

function getAdvice(a){
  const map = {
    "Lawful Good":    ["เคารพกฎหมายและสถาบัน แต่ไม่ยอมรับความอยุติธรรม","พร้อมเผชิญหน้าเมื่อกฎหมายขัดกับความดี","ปกป้องผู้อ่อนแอเป็นพันธกิจหลัก","อาจขัดแย้งกับ Chaotic characters ที่ดูวุ่นวาย"],
    "Neutral Good":   ["ยืดหยุ่นในการเลือกวิธีการ ขอแค่ผลลัพธ์ดี","ทำงานได้กับทุก alignment ถ้าเป้าหมายดี","ไม่ถูกจำกัดด้วยกฎหรืออิสรภาพมากเกินไป","มักเป็นคนกลางในกลุ่มที่มีความขัดแย้ง"],
    "Chaotic Good":   ["ปฏิเสธอำนาจที่ไม่ยุติธรรมอย่างเปิดเผย","มีหัวใจที่ดีแต่วิธีการอาจไม่ตรงใครบางคน","ให้ความสำคัญกับอิสรภาพส่วนบุคคล","อาจทำให้ทีมลำบากเมื่อต้องปฏิบัติตามแผน"],
    "Lawful Neutral": ["ทำตามกฎและระบบอย่างสมบูรณ์","ไม่ตัดสินว่ากฎนั้นดีหรือชั่ว ขอแค่มีกฎ","เหมาะกับบทบาทนักบังคับใช้กฎหมาย ทหาร","อาจดูเย็นชาเมื่อต้องเลือกระหว่างกฎกับความเมตตา"],
    "True Neutral":   ["พยายามรักษาสมดุลในทุกสถานการณ์","ไม่เข้าข้างใครโดยหลักการ","มักเป็น Druid หรือผู้รักษาธรรมชาติ","อาจดูไม่น่าไว้ใจเพราะไม่มีจุดยืนชัดเจน"],
    "Chaotic Neutral":["ทำตามอารมณ์และสัญชาตญาณในทุกสถานการณ์","ไม่สามารถคาดเดาได้ ทั้งพันธมิตรและศัตรู","ไม่ชอบถูกบงการหรือจำกัด","อิสรภาพส่วนตัวคือสิ่งสำคัญที่สุด"],
    "Lawful Evil":    ["ใช้กฎและระบบเป็นเครื่องมือของอำนาจ","มีระเบียบวินัยสูง แต่เพื่อผลประโยชน์ตัวเอง","เคารพสัญญาและข้อตกลง แต่หาช่องว่างเสมอ","อาจเป็นผู้ปกครองเผด็จการหรือผู้นำกิลด์ชั่ว"],
    "Neutral Evil":   ["ทำทุกอย่างเพื่อผลประโยชน์ตัวเองเท่านั้น","ไม่มีความภักดีที่แท้จริง พร้อมเปลี่ยนข้าง","ใช้ทั้งกฎและการทุจริตแล้วแต่อะไรสะดวกกว่า","อันตรายเพราะไม่มีหลักการที่คาดเดาได้"],
    "Chaotic Evil":   ["ทำตามแรงกระตุ้นโดยไม่คิดถึงผลที่ตามมา","ความวุ่นวายและการทำลายล้างคือความสนุก","ไม่ยอมรับอำนาจหรือกฎใด ๆ","อันตรายที่สุดในกลุ่ม ยากจะควบคุม"],
  };
  return map[a] || [];
}

// ===== LOGIC =====
function startQuiz(){
  state.phase='quiz';
  render();
}

function selectAnswer(i){
  state.answers[state.current]=i;
  render();
}

function nextQ(){
  if(state.answers[state.current]!==null && state.current<questions.length-1){
    state.current++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function prevQ(){
  if(state.current>0){ state.current--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function showResult(){
  // Calculate scores
  state.lawScore=0; state.goodScore=0;
  state.answers.forEach((ans,qi)=>{
    if(ans!==null){
      state.lawScore += questions[qi].options[ans].val[0];
      state.goodScore += questions[qi].options[ans].val[1];
    }
  });
  state.phase='result';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function calcAlignment(){
  const law = state.lawScore;
  const good = state.goodScore;
  const lawAxis = law > 4 ? 'Lawful' : law < -4 ? 'Chaotic' : 'Neutral';
  const goodAxis = good > 4 ? 'Good' : good < -4 ? 'Evil' : 'Neutral';
  if(lawAxis==='Neutral' && goodAxis==='Neutral') return 'True Neutral';
  if(lawAxis==='Neutral') return 'Neutral '+goodAxis;
  return lawAxis+' '+goodAxis;
}

function restart(){
  state={phase:'intro',current:0,answers:new Array(questions.length).fill(null),lawScore:0,goodScore:0};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
